<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إرسال معاملة موقعة</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        h1 { color: #58a6ff; text-align: center; }
        .container { max-width: 700px; margin: 0 auto; background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; }
        label { display: block; margin-top: 15px; color: #7ee787; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 5px; }
        button { width: 100%; padding: 12px; margin-top: 20px; background: #238636; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; }
        .result { margin-top: 20px; padding: 15px; background: #0d1117; border: 1px solid #30363d; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 إرسال معاملة موقعة</h1>
        <label>المفتاح الخاص (Private Key):</label>
        <textarea id="privateKey" rows="2" placeholder="الصق مفتاحك الخاص هنا"></textarea>
        
        <label>عنوان المستقبل (Receiver Address):</label>
        <input type="text" id="receiver" placeholder="عنوان محفظة المستقبل">
        
        <label>المبلغ:</label>
        <input type="number" id="amount" placeholder="المبلغ">
        
        <button onclick="sendSignedTransaction()">إرسال المعاملة</button>
        <div id="result" class="result" style="display:none;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/elliptic@6.5.4/lib/elliptic.js"></script>
    <script>
        // ملاحظة: التوقيع في المتصفح يتطلب مكتبة JavaScript، وهذا مثال مبسط
        // في التطبيق الحقيقي، يجب أن يتم التوقيع في جانب العميل باستخدام مكتبات مثل elliptic.js
        async function sendSignedTransaction() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⚠️ ميزة التوقيع في المتصفح قيد التطوير. استخدم أداة مثل Postman لإرسال التوقيع يدوياً.';
        }
    </script>
</body>
</html>
