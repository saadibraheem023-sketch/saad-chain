<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Saad Chain - Wallet</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        h1 { color: #58a6ff; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; }
        label { display: block; margin-top: 15px; color: #7ee787; }
        input { width: 100%; padding: 10px; margin-top: 5px; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 5px; }
        button { width: 100%; padding: 10px; margin-top: 15px; background: #238636; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #0d1117; border: 1px solid #30363d; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👛 محفظة Saad Chain</h1>
        <p>أدخل عنوان محفظتك لمعرفة رصيدك:</p>
        <input type="text" id="addressInput" placeholder="عنوان المحفظة (40 حرفاً)">
        <button onclick="getBalance()">عرض الرصيد</button>
        <div id="result" class="result" style="display:none;"></div>
    </div>

    <script>
        async function getBalance() {
            const address = document.getElementById('addressInput').value;
            const resultDiv = document.getElementById('result');
            
            if (!address) {
                alert('الرجاء إدخال عنوان المحفظة');
                return;
            }
            
            try {
                const response = await fetch(`/balance/${address}`);
                const data = await response.json();
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<strong>العنوان:</strong> ${data.address}<br><strong>الرصيد:</strong> ${data.balance}`;
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `حدث خطأ: ${error.message}`;
            }
        }
    </script>
</body>
</html>
